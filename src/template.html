<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Storrrage</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>{{CSS}}</style>
</head>
<body>
<header class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back" hidden>‹</button>
  <button class="logo" id="logoBtn" aria-label="Storrrage"></button>
  <button class="spacebtn" id="spaceBtn" aria-haspopup="dialog"></button>
  <button class="burger" id="menuBtn" aria-label="Menu"><i class="dot" id="menuDot" hidden></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="2.6" rx="1.3"/><rect x="3" y="10.7" width="18" height="2.6" rx="1.3"/><rect x="3" y="16.4" width="18" height="2.6" rx="1.3"/></svg></button>
</header>
<p class="statusline" id="statusline" hidden></p>
<main id="app" class="wrap"></main>
<button class="fab" id="talkBtn" aria-label="Ask Storrrage"><svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
<nav class="tabbar" aria-label="Main">
  <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg><span class="tl">Active</span></button>
  <button data-tab="add" class="addtab"><svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg><span class="tl">Add</span></button>
  <button data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><span class="tl">Search</span></button>
</nav>
<dialog id="sheet"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>{{QRCODE}}</script>
<script>{{JSQR}}</script>
<script>{{APP}}</script>
</body>
</html>
