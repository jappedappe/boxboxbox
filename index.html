<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C79D63">
<title>Storrrage</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DADBD5; --surface:#F4F4F1; --ink:#1E1D1B; --muted:#5D5B55; --line:#BEBEB6;
  --kraft:#C79D63; --kraft-dark:#A97F47; --kraft-ink:#2E2112; --tape:#E8B62E; --danger:#A3362A;
  --ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --stencil:"Big Shoulders Stencil Display", "Archivo", Impact, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1B19; --surface:#252623; --ink:#ECEBE5; --muted:#A3A199; --line:#3B3C38;
    --kraft:#8E6A3E; --kraft-dark:#6F522E; --kraft-ink:#FBF0DF; --tape:#D8A726; --danger:#E0786A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1B19; --surface:#252623; --ink:#ECEBE5; --muted:#A3A199; --line:#3B3C38;
  --kraft:#8E6A3E; --kraft-dark:#6F522E; --kraft-ink:#FBF0DF; --tape:#D8A726; --danger:#E0786A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-stretch:125%;font-size:1.5rem;letter-spacing:-.01em;margin:0;flex:1}
.searchrow{margin-top:10px}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.search::placeholder{color:var(--muted)}

.btn{border:1.5px solid var(--ink);background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;padding:8px;cursor:pointer;border-radius:8px;font-weight:600}

.summary{margin:20px 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

/* The box tile: the one loud element. Kraft board, stencil code. */
.tile{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;cursor:pointer;
  background:var(--kraft);color:var(--kraft-ink);border:none;border-radius:4px;padding:14px 16px;
  box-shadow:inset 0 -3px 0 var(--kraft-dark)}
.tile:hover{filter:brightness(1.04)}
.code{font-family:var(--stencil);font-weight:800;font-size:2.4rem;line-height:.9;letter-spacing:.01em;min-width:3.6ch}
.tile-body{display:flex;flex-direction:column;justify-content:center;min-width:0}
.tile-name{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-meta{font-size:.88rem;opacity:.85}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:28px 22px;margin-top:24px;max-width:56ch}
.empty h2{margin:0 0 6px;font-size:1.15rem}
.empty p{margin:0 0 16px;color:var(--muted)}

.back{margin:16px 0 8px;padding-left:0}
.boxhead{background:var(--kraft);color:var(--kraft-ink);border-radius:4px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:16px;box-shadow:inset 0 -4px 0 var(--kraft-dark)}
.boxhead .code{font-size:4rem}
.boxhead h2{margin:6px 0 2px;font-size:1.35rem}
.boxhead p{margin:0;font-size:.92rem;opacity:.9}
.boxhead .qr{background:#fff;padding:8px;border-radius:4px;width:96px;height:96px;align-self:start;border:none;cursor:pointer}
.boxhead .qr svg{width:100%;height:100%;display:block}
.boxphoto{margin-top:12px;border-radius:4px;max-height:240px;object-fit:cover;width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}

.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.item:hover{background:var(--surface)}
.thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface);border:1px solid var(--line)}
.thumb.none{display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.item-main{flex:1;min-width:0}
.item-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:.86rem;color:var(--muted)}
.item-right{text-align:right;font-size:.86rem;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;font-family:var(--stencil);font-weight:800;background:var(--kraft);color:var(--kraft-ink);padding:1px 7px;border-radius:3px;font-size:1rem;line-height:1.3}
.hint{color:var(--muted);font-size:.9rem}
.status{margin-top:40px;color:var(--muted)}

/* Sheets */
dialog{border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 20px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,10,8,.55)}
.sheet{padding:20px}
.sheet h3{margin:0 0 14px;font-size:1.2rem}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.ph button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.addph{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:.82rem;text-align:center;padding:4px}
.addph input{display:none}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.sheet-foot .spacer{flex:1}
.proof{font-size:.82rem;color:var(--muted);margin:-4px 0 14px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left}
.menu p{margin:0 0 8px}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,520px);z-index:20;font-size:.92rem}
@media (max-width:480px){.code{font-size:2.1rem}.boxhead .code{font-size:3.2rem}.boxhead .qr{width:76px;height:76px}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.banner{background:var(--surface);border-left:4px solid var(--tape);padding:10px 14px;border-radius:6px;margin:16px 0 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px;font-size:.92rem}

.thumb.icon{font-size:1.9rem;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.namerow{display:flex;gap:10px;align-items:center}
.namerow .thumb{width:46px;height:46px;font-size:1.6rem}
.namerow input{flex:1}

#viewer{width:100vw;height:100%;max-width:none;max-height:none;margin:0;padding:0;border-radius:0;background:#000;color:#fff}
#viewer::backdrop{background:#000}
.vwrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
.vwrap img{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none}
.vclose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:1.6rem;cursor:pointer}
.vhint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;margin:0;font-size:.85rem;opacity:.7}
.ph img,.boxphoto{cursor:zoom-in}
.wrap{padding-bottom:120px}
.statusline{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:none;border-radius:999px;padding:15px 22px;background:var(--ink);color:var(--bg);font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chipbtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipbtn.add{border-style:dashed;color:var(--muted)}
details.more{margin:2px 0 14px}
details.more summary{cursor:pointer;font-weight:600;font-size:.92rem;margin-bottom:10px}
.vlog{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.vl{padding:8px 12px;border-radius:12px;max-width:88%;font-size:.95rem}
.vl.you{align-self:flex-end;background:var(--ink);color:var(--bg)}
.vl.app{align-self:flex-start;background:var(--bg)}
.vl .btn{margin-top:6px;padding:6px 10px}
.mic{display:block;width:100%;padding:22px;border-radius:14px;border:none;background:var(--kraft);color:var(--kraft-ink);font-weight:800;font-size:1.15rem;cursor:pointer;box-shadow:inset 0 -4px 0 var(--kraft-dark)}
.mic.on{background:var(--tape);color:#1E1D1B}
.vtype{display:flex;gap:8px;margin:12px 0}
.vtype input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn.rec{border-color:var(--danger);color:var(--danger)}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem;margin:4px 0 12px}
.help{margin:0 0 4px;padding-left:18px;color:var(--muted);font-size:.92rem}
.notes h3{font-size:1rem;margin:24px 0 8px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.note audio{flex:1 1 220px;height:40px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item-name,.item-sub{display:block}
.placebar{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;margin:0;scrollbar-width:none}
.placebar::-webkit-scrollbar{display:none}
.placebar .chipbtn{flex:none;font-weight:600}
.placehead{font-size:1.15rem;margin:26px 0 10px;padding-top:12px;border-top:2px solid var(--ink)}
.loosehead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 6px}
.loosehead h3{margin:0;font-size:1rem}
.btn.small{padding:6px 11px;font-size:.88rem}
.chip.loose{font-family:var(--ui);font-weight:700;font-size:.78rem;background:transparent;border:1.5px solid var(--kraft-dark);color:var(--ink)}
.item-right small{font-size:.75rem}
.scope{margin:18px 0 0;color:var(--muted);font-size:.92rem}
.linkbtn{border:none;background:none;padding:0;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--ink)}

.vlive{background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.98rem;min-height:2.6em}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1 class="brand">Storrrage</h1>
      <button class="btn quiet" id="scanBtn">Scan label</button>
      <button class="btn primary" id="newBoxBtn">New box</button>
      <button class="iconbtn" id="menuBtn" aria-label="More options">•••</button>
    </div>
    <div class="searchrow">
      <input class="search" id="search" type="search" placeholder="Find anything, e.g. tent, Elsa’s boots, verktyg" autocomplete="off">
    </div>
    <p class="statusline" id="statusline" hidden></p>
  </header>
  <main id="app"></main>
</div>
<button class="fab" id="talkBtn">🎙 Talk</button>
<dialog id="sheet"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }

const STOP = new Set(['the','a','an','my','our','any','some','for','of','in','to','with','and','is','are','we','do','have','has','got',
  'anything','something','stuff','things','thing','where','och','min','mitt','mina','vår','vårt','våra','en','ett','till','för','med',
  'i','på','något','nåt','någon','några','har','vi','det','den','de','är','var','finns','saker','sak','grejer','grej','prylar','alla']);
function stems(tok){
  const out = [tok];
  if (tok.endsWith("'s")) out.push(tok.slice(0, -2));
  for (const suf of ['arna','erna','orna','na','et','en','ar','er','or','es','s','n'])
    if (tok.endsWith(suf) && tok.length - suf.length >= 4) out.push(tok.slice(0, -suf.length));
  return [...new Set(out)];
}
function itemHay(it, b){
  const hay = [it.name, it.category, it.notes, (it.tags || []).join(' '), it.owner, it.spot, placeName(b.placeId), it.size ? 'size storlek ' + it.size : '',
    it.color, it.season, it.brand, it.model, it.serial, b.loose ? '' : b.name, b.loose ? '' : b.code, b.location].filter(Boolean).join(' ').toLowerCase();
  return {hay, toks: new Set(hay.split(/[^a-zåäöéü0-9.-]+/).filter(Boolean))};
}
function tokScore(tok, H, icon){
  const ss = stems(tok);
  const lit = w => w.length <= 3 ? H.toks.has(w) : H.hay.includes(w);
  if (ss.some(lit)) return 2;
  for (const g of SYN) if (ss.some(s => g.includes(s)) && g.some(lit)) return 2;
  for (const [names, icons] of GROUP_NAMES) if (ss.some(s => names.includes(s)) && icons.includes(icon)) return 1;
  const ti = ss.map(matchIcon).find(Boolean);
  if (ti && ti === icon) return 1;
  return 0;
}
function queryTokens(q){
  return q.toLowerCase().replace(/['’]s(?=\s|$)/g, '').split(/[^a-zåäöéü0-9.-]+/).filter(t => t && !STOP.has(t));
}
function searchItems(q, opts = {}){
  if (typeof opts === 'string') opts = {boxId: opts};
  const toks = queryTokens(q), exact = [], related = [];
  if (!toks.length) return {exact, related};
  for (const b of boxes){
    if (opts.boxId && b.id !== opts.boxId) continue;
    if (opts.placeId && b.placeId !== opts.placeId) continue;
    for (const it of (b.items || [])){
      const H = itemHay(it, b), icon = guessIcon(it);
      let min = 2;
      for (const t of toks){ const s = tokScore(t, H, icon); if (s < min) min = s; if (!min) break; }
      if (min === 2) exact.push([it, b]); else if (min === 1) related.push([it, b]);
    }
  }
  return {exact, related};
}

function putBox(box){
  box.updatedAt = new Date().toISOString();
  const i = boxes.findIndex(b => b.id === box.id);
  if (i < 0) boxes.push(box); else boxes[i] = box;
  dbPut(clone(box)).catch(e => toast(saveErr(e)));
  render();
}
function removeBox(id){
  boxes = boxes.filter(b => b.id !== id);
  dbDel(id).catch(e => toast(saveErr(e)));
  render();
}

/* ---------- photos ---------- */
async function shrink(file, max){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  if (bmp.close) bmp.close();
  return cv;
}
const toBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));
// Photos: longest side 1600 px (sharp enough to read labels and serial numbers when zoomed),
// saved as WebP, which is roughly a third smaller than JPEG at the same quality. JPEG if WebP isn't supported.
const PHOTO_MAX = 1600, PHOTO_QUALITY = .78;
async function storePhoto(file){
  const takenAt = new Date(file.lastModified || Date.now()).toISOString();
  const cv = await shrink(file, PHOTO_MAX);
  let blob = await toBlob(cv, 'image/webp', PHOTO_QUALITY);
  if (!blob || blob.type !== 'image/webp') blob = await toBlob(cv, 'image/jpeg', .8);
  const ref = newId();
  await phPut(ref, blob);
  return {ref, takenAt, addedAt: new Date().toISOString()};
}
const urls = new Map();
async function photoURL(ref){
  if (urls.has(ref)) return urls.get(ref);
  const b = await phGet(ref).catch(() => null); if (!b) return '';
  const u = URL.createObjectURL(b); urls.set(ref, u); return u;
}
function hydrate(root = document){
  root.querySelectorAll('img[data-ph]:not([src])').forEach(async img => { const u = await photoURL(img.dataset.ph); if (u) img.src = u; });
}
function dropPhoto(ref){
  if (!ref) return;
  phDel(ref).catch(() => {});
  if (urls.has(ref)){ URL.revokeObjectURL(urls.get(ref)); urls.delete(ref); }
}

const viewer = document.createElement('dialog');
viewer.id = 'viewer';
viewer.innerHTML = '<div class="vwrap"><img id="vImg" alt=""></div><button class="vclose" aria-label="Close photo">×</button><p class="vhint">Pinch or double-tap to zoom</p>';
document.body.appendChild(viewer);
(() => {
  const img = viewer.querySelector('#vImg'), wrap = viewer.querySelector('.vwrap');
  let sc = 1, x = 0, y = 0, start = null, lastTap = 0, down = null;
  const pts = new Map();
  const apply = () => { img.style.transform = `translate(${x}px, ${y}px) scale(${sc})`; };
  const reset = () => { sc = 1; x = 0; y = 0; apply(); };
  const dist = () => { const [p, q] = [...pts.values()]; return Math.hypot(p.x - q.x, p.y - q.y); };
  const begin = () => {
    if (pts.size === 2) start = {d: dist(), sc};
    else if (pts.size === 1){ const p = [...pts.values()][0]; start = {px: p.x, py: p.y, x, y}; }
  };
  wrap.addEventListener('pointerdown', e => {
    wrap.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 1) down = {x: e.clientX, y: e.clientY, t: Date.now()};
    begin();
  });
  wrap.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2 && start && start.d){ sc = Math.min(6, Math.max(1, start.sc * dist() / start.d)); if (sc === 1){ x = 0; y = 0; } apply(); }
    else if (pts.size === 1 && sc > 1 && start && start.px !== undefined){ x = start.x + e.clientX - start.px; y = start.y + e.clientY - start.py; apply(); }
  });
  const up = e => {
    pts.delete(e.pointerId); begin();
    if (pts.size === 0 && down && Date.now() - down.t < 250 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 10){
      if (Date.now() - lastTap < 320){ if (sc > 1) reset(); else { sc = 2.5; apply(); } lastTap = 0; }
      else lastTap = Date.now();
    }
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  viewer.querySelector('.vclose').onclick = () => viewer.close();
  window.openViewer = async ref => {
    const u = await photoURL(ref); if (!u) return;
    img.src = u; reset(); pts.clear(); viewer.showModal();
  };
})();

const sheet = $('#sheet');
let onSheetClose = null;

}

function photoState(initial, multiple){
  const st = {photos: clone(initial), added: [], removed: [], busy: false};
  const draw = () => {
    const w = $('#phwrap');
    w.innerHTML = `<div class="photos">${st.photos.map((p, i) => `<div class="ph">${imgTag(p.ref, '')}<button data-rm="${i}" aria-label="Remove photo">×</button></div>`).join('')}
      ${multiple || !st.photos.length ? `<label class="addph">Add photo<input type="file" accept="image/*" ${multiple ? 'multiple' : ''}></label>` : ''}</div>`;
    hydrate(w);
  };
  st.mount = () => {
    draw();
    $('#phwrap').addEventListener('change', async e => {
      if (!e.target.files) return;
      const files = [...e.target.files]; st.busy = true;
      $('#phwrap').insertAdjacentHTML('beforeend', '<p class="hint">Saving photo…</p>');
      for (const f of files){
        try { const p = await storePhoto(f); st.photos.push(p); st.added.push(p.ref); }
        catch (err) { toast(saveErr(err)); }
      }
      st.busy = false; draw();
    });
    $('#phwrap').addEventListener('click', e => {
      const im = e.target.closest('img[data-ph]'); if (im) return openViewer(im.dataset.ph);
      const rm = e.target.closest('[data-rm]'); if (!rm) return;
      const [p] = st.photos.splice(+rm.dataset.rm, 1);
      if (st.added.includes(p.ref)){ st.added = st.added.filter(r => r !== p.ref); dropPhoto(p.ref); } else st.removed.push(p.ref);
      draw();
    });
  };
  st.commit = () => { st.removed.forEach(dropPhoto); st.added = []; st.removed = []; };
  st.discard = () => { st.added.forEach(dropPhoto); st.added = []; };
  return st;
}

function boxSheet(id){
  const existing = id ? findBox(id) : null;
  const b = existing ? clone(existing) : {id: newId(), code: nextCode(), name: '', location: '', notes: '', items: [], createdAt: new Date().toISOString(), placeId: scopePlace() || places[0].id};

      <button class="btn quiet" id="bCancel">Cancel</button>

    </div>`, () => { if (!saved) ps.discard(); });
  ps.mount();

    saved = true; ps.discard();
    if (existing.photo) dropPhoto(existing.photo.ref);
    (existing.items || []).forEach(i => (i.photos || []).forEach(p => dropPhoto(p.ref)));
    view = {name: 'home'}; removeBox(existing.id); closeSheet(); toast(`${existing.code} deleted.`);
  };
}

/* ---------- item details: owner, size, colour and more, depending on what the item is ---------- */
const KINDS = {
  clothes: ['🧥','👗','🧣','🧢','👕'], shoes: ['🥾','👟'], kids: ['👶','🧸'],
  sports: ['🎿','⛸️','🛷','🚲','🛴','🏒','🎾','⚽','🎣','🏋️'],
  tech: ['📺','💻','🖨️','📱','🎧','🔊','🔌','📷','🎮'], tools: ['🛠️','🪜','🧹','🔩'], music: ['🎸','🎹','🥁','🎻'],
};
const KIND_FIELDS = {
  clothes: ['owner','size','color','season'], shoes: ['owner','size','color','season'], kids: ['owner','size','color'],
  sports: ['owner','size','brand'], tech: ['brand','model','serial'], tools: ['brand','model','serial'],
  music: ['owner','brand','model','serial'], other: ['owner','color','brand'],
};
const ALL_FIELDS = ['owner','size','color','season','brand','model','serial'];
const FIELD_LABEL = {owner: 'Whose is it', size: 'Size', color: 'Colour', season: 'Season', brand: 'Brand', model: 'Model', serial: 'Serial number'};
const COLORS = ['Black','White','Grey','Blue','Red','Green','Yellow','Pink','Purple','Brown','Beige','Multicolour'];
const SEASONS = ['Winter','Summer','Spring/autumn','All year'];
function kindOf(it){ const ic = guessIcon(it); for (const k in KINDS) if (KINDS[k].includes(ic)) return k; return 'other'; }
function recentValues(field, kind){
  const out = [];
  boxes.forEach(b => (b.items || []).forEach(i => { if (i[field] && (!kind || kindOf(i) === kind) && !out.includes(i[field])) out.push(i[field]); }));
  return out.slice(-6);
}
function chipsFor(field, kind){
  if (field === 'owner') return [...household, 'Shared'];
  if (field === 'color') return COLORS;
  if (field === 'season') return SEASONS;
  if (field === 'size') return [...new Set([...recentValues('size', kind), ...(kind === 'clothes' ? ['XS','S','M','L','XL','XXL'] : [])])];
  if (field === 'brand') return recentValues('brand');
  return [];
}
function detailsHTML(attrs, kind, moreOpen){
  const main = KIND_FIELDS[kind], rest = ALL_FIELDS.filter(f => !main.includes(f));
  const field = k => {
    const v = attrs[k] || '', chips = chipsFor(k, kind);
    return `<div class="field" data-f="${k}"><span>${FIELD_LABEL[k]}</span>
      <input data-attr="${k}" value="${esc(v)}" ${k === 'serial' ? 'autocapitalize="characters"' : ''} ${k === 'size' ? 'inputmode="text"' : ''}>
      ${chips.length || k === 'owner' ? `<div class="chips">${chips.map(c => `<button type="button" class="chipbtn${v.toLowerCase() === c.toLowerCase() ? ' on' : ''}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}${k === 'owner' ? '<button type="button" class="chipbtn add" data-addperson>+ Person</button>' : ''}</div>` : ''}
    </div>`;
  };
  return main.map(field).join('') + `<details class="more" ${moreOpen ? 'open' : ''}><summary>More details</summary>${rest.map(field).join('')}</details>`;
}
function addPerson(name){
  name = (name || '').trim(); if (!name) return '';
  const hit = household.find(h => h.toLowerCase() === name.toLowerCase()); if (hit) return hit;
  household.push(name); metaPut('household', household).catch(() => {}); return name;
}

    Object.assign(it, {name, category: $('#iCat').value.trim(), value: $('#iVal').value ? Math.max(0, +$('#iVal').value) : '',
      storedOn: $('#iDate').value || today(), notes: $('#iNotes').value.trim(), photos: ps.photos,

    ALL_FIELDS.forEach(f => { const v = (attrs[f] || '').trim(); if (v) it[f] = v; else delete it[f]; });
    if (it.owner && it.owner !== 'Shared') addPerson(it.owner);
    if (existing) it.updatedAt = new Date().toISOString();
    const sel = $('#iBox').value;
    if (sel.startsWith('loose:') && $('#iSpot').value.trim()) it.spot = $('#iSpot').value.trim(); else delete it.spot;
    const targetId = sel.startsWith('loose:') ? ensureLoose(sel.slice(6)).id : sel;
    ps.commit(); saved = true;
    const from = clone(findBox(boxId));
    from.items = (from.items || []).filter(i => i.id !== it.id);
    if (targetId === boxId){ from.items.push(it); putBox(from); }
    else { putBox(from); const t = clone(findBox(targetId)); t.items = (t.items || []).concat(it); putBox(t); toast(`Moved to ${t.code}.`); }
    closeSheet();
    if (again) setTimeout(() => { itemSheet(targetId); toast(`${name} added.`); }, 0);
  };
  $('#iSave').onclick = () => save(false);
  if (!existing) $('#iSaveMore').onclick = () => save(true);
  if (existing) $('#iDel').onclick = () => {
    if (!confirm(`Delete “${existing.name}”? This can’t be undone.`)) return;
    saved = true; ps.discard(); (existing.photos || []).forEach(p => dropPhoto(p.ref));
    const b2 = clone(findBox(boxId)); b2.items = b2.items.filter(i => i.id !== existing.id); putBox(b2); closeSheet();
  };
}

/* ---------- scanning ---------- */
function scanSheet(){
  let stream = null, raf = 0, done = false;
  const stop = () => { done = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); };
  openSheet(`<h3>Scan a box label</h3>
    <video id="cam" playsinline muted></video>
    <p class="hint" id="camMsg">Point the camera at the QR code on the box.</p>
    <label class="field"><span>Or type the box code</span><input id="codeIn" placeholder="B-014" autocapitalize="characters"></label>
    <div class="sheet-foot"><button class="btn quiet" id="sClose">Close</button><button class="btn primary" id="sGo">Open box</button></div>`, stop);
  $('#sClose').onclick = closeSheet;
  const go = raw => {
    const m = String(raw).toUpperCase().match(/B-?\s*(\d+)/);
    const b = m && boxes.find(x => parseInt(x.code.slice(2)) === parseInt(m[1]));
    if (!b){ toast(`No box with code ${raw}.`); return false; }
    closeSheet(); openBox(b.id); return true;
  };
  $('#sGo').onclick = () => go($('#codeIn').value);
  $('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(e.target.value); });
  const video = $('#cam');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ video.hidden = true; $('#camMsg').textContent = 'The camera isn’t available here. Type the code from the label instead.'; return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}}).then(s => {
    if (done){ s.getTracks().forEach(t => t.stop()); return; }
    stream = s; video.srcObject = s; video.play();
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently: true});
    const tick = () => {
      if (done) return;
      if (video.readyState >= 2 && video.videoWidth){
        const w = 480, h = Math.round(w * video.videoHeight / video.videoWidth);
        cv.width = w; cv.height = h; ctx.drawImage(video, 0, 0, w, h);
        const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'dontInvert'});
        if (r && r.data && r.data.startsWith('BOXES:') && go(r.data.slice(6))) return;
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(() => { video.hidden = true; $('#camMsg').textContent = 'Camera access was blocked. Type the code from the label instead, or allow the camera for this app in Chrome’s site settings.'; });
}

    const blob = new Blob(chunks, {type: r.mimeType || 'audio/webm'});
    const n = {id: newId(), boxId, createdAt: new Date().toISOString(), duration: Math.max(1, Math.round((Date.now() - recStart) / 1000)), blob, by: me || ''};
    try { await notePut(n); notes.push(n); updateStatus(); render(); const b = boxId && findBox(boxId); logLine('app', `Voice note saved${b ? ' to ' + b.code : ''} (${n.duration} s).`); }
    catch (e){ toast(saveErr(e)); }
  };
  r.start(); recStart = Date.now(); recTimer = setInterval(updRecBtn, 500); updRecBtn();
}

function voiceSheet(){
  openSheet(`<h3>Talk to Storrrage</h3>
    <p class="hint" id="vCtx"></p>
    <div class="vlog" id="vlog" aria-live="polite"></div>
    <div class="vlive" id="vLive" hidden></div>
    ${SR ? '<button class="mic" id="micBtn"></button>' : '<p class="hint">Speech recognition isn’t available in this browser. Use the microphone on your keyboard in the box below instead.</p>'}
    <div class="vtype"><input id="vText" enterkeyhint="send" autocomplete="off"><button class="btn primary" id="vSend">Send</button></div>
    <div class="vrow">
      <button class="btn quiet" id="recBtn"></button>
      <span class="chips" style="margin:0"><button type="button" class="chipbtn" data-lang="sv-SE">Svenska</button><button type="button" class="chipbtn" data-lang="en-US">English</button></span>
    </div>
    <label class="check"><input type="checkbox" id="vSpeak" ${speakOn ? 'checked' : ''}> Read answers out loud</label>
    ${SR ? `<div class="field"><span>Act on what I said after a pause of</span><div class="chips" id="vPause">${SILENCE_CHOICES.map(([ms, l]) => `<button type="button" class="chipbtn${ms === silenceMs ? ' on' : ''}" data-ms="${ms}">${l}</button>`).join('')}</div></div>` : ''}
    <details class="more"><summary>What can I say?</summary><ul class="help" id="vHelp"></ul></details>
    <details class="more"><summary>Using it without signal</summary><p class="hint">Chrome’s speech recognition usually needs signal. Without it, tap the text box and use the microphone on your keyboard instead. Gboard can recognise speech offline once you’ve downloaded the language: open Gboard’s settings, then Voice typing, and download Swedish and English for offline use (menu names vary a little between phones). Or record a voice note and deal with it later.</p></details>
    <div class="sheet-foot"><button class="btn" id="vClose">Close</button></div>`, () => { stopListening(); if (rec) rec.stop(); if (window.speechSynthesis) speechSynthesis.cancel(); });
  const drawLang = () => {
    sheet.querySelectorAll('[data-lang]').forEach(c => c.classList.toggle('on', c.dataset.lang === voiceLang));
    $('#vHelp').innerHTML = HELP[L()].map(h => `<li>“${esc(h)}”</li>`).join('');
    $('#vText').placeholder = vPlaceholder(); setMic('off'); drawLog();
  };
  drawLang(); updateCtx(); updRecBtn();
  if (SR) $('#micBtn').onclick = listen;
  const send = () => { const v = $('#vText'); const x = v.value; v.value = ''; if (x.trim()) handleBatch(x); };
  if (SR) $('#vPause').onclick = e => {
    const c = e.target.closest('[data-ms]'); if (!c) return;
    silenceMs = +c.dataset.ms; metaPut('silenceMs', silenceMs).catch(() => {});
    $('#vPause').querySelectorAll('[data-ms]').forEach(x => x.classList.toggle('on', +x.dataset.ms === silenceMs));
  };
  $('#vSend').onclick = send;
  $('#vText').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  $('#recBtn').onclick = toggleRecord;
  $('#vSpeak').onchange = e => { speakOn = e.target.checked; if (!speakOn && window.speechSynthesis) speechSynthesis.cancel(); };
  sheet.querySelector('.vrow').addEventListener('click', e => {
    const c = e.target.closest('[data-lang]'); if (!c) return;
    voiceLang = c.dataset.lang; metaPut('voiceLang', voiceLang).catch(() => {}); stopListening(); drawLang();
  });
  $('#vlog').addEventListener('click', e => {
    const b = e.target.closest('[data-vact]'); if (!b) return;
    const l = voiceLog[+b.dataset.vact]; if (l && l.action){ const run = l.action.run; l.action = null; drawLog(); run(); }
  });
  $('#vClose').onclick = closeSheet;
}

/* status line: offline, voice notes waiting */
function updateStatus(){
  const el = $('#statusline'); if (!el) return;
  const parts = [];
  if (!navigator.onLine) parts.push('Offline. Everything you do is saved on this phone.');
  if (notes.length) parts.push(`${notes.length} voice ${notes.length === 1 ? 'note' : 'notes'} waiting.`);
  el.textContent = parts.join(' '); el.hidden = !parts.length;
}
window.addEventListener('online', updateStatus); window.addEventListener('offline', updateStatus);

/* ---------- files out ---------- */
function deliver(filename, blob, title, onDone){
  const file = new File([blob], filename, {type: blob.type});
  const canShare = !!(navigator.canShare && navigator.canShare({files: [file]}));
  openSheet(`<h3>${esc(title)}</h3><p class="hint">${esc(filename)}, ${(blob.size / 1048576).toFixed(1)} MB</p>
    <div class="menu" style="margin-top:12px">
      ${canShare ? '<button class="btn primary" id="fShare">Share to Drive, email or another app</button>' : ''}
      <button class="btn ${canShare ? 'quiet' : 'primary'}" id="fSave">Save to phone (Downloads)</button>
      <button class="btn quiet" id="fClose">Close</button></div>`);
  $('#fClose').onclick = closeSheet;
  $('#fSave').onclick = () => {
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    closeSheet(); toast('Saved to your Downloads folder.'); if (onDone) onDone();
  };
  if (canShare) $('#fShare').onclick = async () => {
    try { await navigator.share({files: [file], title: filename}); closeSheet(); if (onDone) onDone(); }
    catch (e){ if (e.name !== 'AbortError') toast('Sharing didn’t work. Use Save to phone instead.'); }
  };
}
function labels(list){
  const ls = [...list].sort(byCode).map(b => `<div class="l"><div class="q">${qrSvg(labelText(b), 6)}</div><div><div class="c">${esc(b.code)}</div><div class="n">${esc(b.name)}</div></div></div>`).join('');
  const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box labels</title><style>
    body{font-family:Arial,sans-serif;margin:12mm}.g{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
    .l{border:1.5px dashed #888;padding:6mm;display:flex;gap:6mm;align-items:center;break-inside:avoid}
    .q{width:34mm;height:34mm;flex:none}.q svg{width:100%;height:100%}.c{font:900 30pt/1 Impact,Arial Black,sans-serif}.n{font-size:12pt;margin-top:2mm}
    p{color:#555}@media print{p{display:none}}</style></head><body><p>Print this page, cut out the labels and tape them to the boxes.</p><div class="g">${ls}</div></body></html>`;
  deliver(list.length === 1 ? `label-${list[0].code}.html` : 'box-labels.html', new Blob([html], {type: 'text/html'}), list.length === 1 ? `Label for ${list[0].code}` : 'Labels for all boxes');
}
async function thumbData(ref){
  try { const b = await phGet(ref); if (!b) return ''; return (await shrink(b, 360)).toDataURL('image/jpeg', .72); }
  catch { return ''; }
}
async function insuranceReport(){
  if (!boxes.length) return toast('Add some boxes first.');
  toast('Building the report…');
  const pi = b => places.findIndex(p => p.id === b.placeId);
  const all = [...boxes].filter(b => !b.loose || (b.items || []).length).sort((x, y) => pi(x) - pi(y) || (x.loose ? -1 : 0) - (y.loose ? -1 : 0) || byCode(x, y));
  const total = all.reduce((s, b) => s + boxValue(b), 0);
  let body = '';
  for (const b of all){
    let rows = '';
    for (const it of (b.items || [])){
      const imgs = [];
      for (const p of (it.photos || [])){ const d = await thumbData(p.ref); if (d) imgs.push(`<img src="${d}" alt=""><br><small>Photo ${esc(fmtStamp(p.takenAt))}</small>`); }
      rows += `<tr><td><b>${esc(it.name)}</b>${it.category ? `<br>${esc(it.category)}` : ''}${it.notes ? `<br><small>${esc(it.notes)}</small>` : ''}</td>
        <td>${esc(kr(it.value))}</td><td>${esc(it.storedOn)}</td><td>${esc(fmtStamp(it.addedAt))}</td><td class="ph">${imgs.join('<br>')}</td></tr>`;
    }
    const bimg = b.photo ? await thumbData(b.photo.ref) : '';
    body += `<section><h2>${b.loose ? `${esc(placeName(b.placeId))}: not in a box` : `${esc(b.code)} ${esc(b.name)}`}</h2><p>${esc([placeName(b.placeId), b.location].filter(Boolean).join(', '))}. Packed ${esc(fmtDate(b.createdAt))}. ${(b.items || []).length} items, ${esc(kr(boxValue(b)) || '0 kr')}.</p>
      ${bimg ? `<img class="box" src="${bimg}" alt="">` : ''}
      ${rows ? `<table><tr><th>Item</th><th>Est. value</th><th>Stored since</th><th>Registered</th><th>Photos</th></tr>${rows}</table>` : '<p>Empty.</p>'}</section>`;
  }
  const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage inventory ${today()}</title><style>
    body{font-family:Arial,sans-serif;margin:14mm;color:#111}h1{margin:0}table{border-collapse:collapse;width:100%;margin:8px 0 24px}
    th,td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:left;font-size:10pt}td.ph img{width:110px}img.box{width:200px}
    section{break-inside:avoid-page}small{color:#555}</style></head><body>
    <h1>Storage inventory</h1><p>Generated ${esc(fmtStamp(new Date().toISOString()))}. ${all.filter(b => !b.loose).length} boxes, ${all.reduce((s, b) => s + (b.items || []).length, 0)} items, estimated total value ${esc(kr(total) || '0 kr')}.</p>
    <p>"Registered" is when the item was entered in the inventory. Photo times come from the image file.</p>${body}</body></html>`;
  deliver(`storage-inventory-${today()}.html`, new Blob([html], {type: 'text/html'}), 'Insurance report ready');
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function backup(){
  if (!boxes.length && !notes.length) return toast('Nothing to back up yet.');
  toast('Preparing backup…');
  const photos = {};
  const refs = boxes.flatMap(b => [b.photo && b.photo.ref, ...(b.items || []).flatMap(i => (i.photos || []).map(p => p.ref))]).filter(Boolean);
  for (const ref of refs){ const b = await phGet(ref).catch(() => null); if (b) photos[ref] = await blobToDataURL(b); }
  const notesOut = [];
  for (const n of notes) notesOut.push({...n, blob: undefined, audio: n.blob ? await blobToDataURL(n.blob) : ''});
  const json = JSON.stringify({app: 'boxes', version: 3, exportedAt: new Date().toISOString(), boxes, photos, household, places, notes: notesOut});
  deliver(`storrrage-backup-${today()}.json`, new Blob([json], {type: 'application/json'}), 'Backup ready', async () => {
    lastBackup = new Date().toISOString(); await metaPut('lastBackup', lastBackup).catch(() => {}); render();
  });
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); const list = Array.isArray(data) ? data : data.boxes;
    if (!Array.isArray(list)) throw 0;
    toast('Restoring…');
    let n = 0;
    for (const b of list){
      if (!b || !b.id || !b.code || findBox(b.id)) continue;
      const refs = [b.photo && b.photo.ref, ...(b.items || []).flatMap(i => (i.photos || []).map(p => p.ref))].filter(Boolean);
      for (const r of refs){ const d = data.photos && data.photos[r]; if (d) await phPut(r, await (await fetch(d)).blob()); }
      putBox(b); n++;
    }
    (data.household || []).forEach(addPerson);
    (data.places || []).forEach(p => { if (p && p.id && !findPlace(p.id)){ places.push(p); } }); metaPut('places', places).catch(() => {});
    boxes.forEach(b => { if (!b.placeId || !findPlace(b.placeId)){ b.placeId = places[0].id; dbPut(clone(b)).catch(() => {}); } });
    let k = 0;
    for (const x of (data.notes || [])){
      if (!x || !x.id || notes.some(y => y.id === x.id) || !x.audio) continue;
      const nn = {id: x.id, boxId: x.boxId || null, createdAt: x.createdAt, duration: x.duration || 0, by: x.by || '', blob: await (await fetch(x.audio)).blob()};
      await notePut(nn); notes.push(nn); k++;
    }
    updateStatus(); render();
    toast(n || k ? `Restored ${n} ${n === 1 ? 'box' : 'boxes'}${k ? ` and ${k} voice ${k === 1 ? 'note' : 'notes'}` : ''}.` : 'Everything in that backup is already here.');
  } catch { toast('That file isn’t a Storrrage backup.'); }
});
function menuSheet(){
  openSheet(`<h3>More</h3><div class="menu">
    <p class="hint">Everything is stored only on this phone. ${lastBackup ? `Last backup: ${esc(fmtDate(lastBackup))}.` : 'No backup made yet.'} <span id="usage"></span></p>
    <button class="btn quiet" data-m="backup">Back up now</button>
    <button class="btn quiet" data-m="places">Storage places</button>
    <button class="btn quiet" data-m="people">People in the household</button>
    <button class="btn quiet" data-m="report">Make insurance report</button>
    <button class="btn quiet" data-m="labels">Get labels for all boxes</button>
    <button class="btn quiet" data-m="import">Restore from backup</button>
    <button class="btn" data-m="close" style="margin-top:6px">Close</button></div>`);
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => {
    const el = $('#usage'); if (el && est.usage) el.textContent = `Storrrage is using about ${Math.max(1, Math.round(est.usage / 1048576))} MB.`;
  }).catch(() => {});
  sheet.querySelector('.menu').onclick = e => {
    const m = e.target.closest('[data-m]'); if (!m) return; const k = m.dataset.m;
    if (k === 'close') return closeSheet();
    if (k === 'import'){ closeSheet(); return $('#importFile').click(); }
    if (k === 'backup') backup();
    if (k === 'people') peopleSheet();
    if (k === 'report') insuranceReport();
    if (k === 'labels') realBoxes().length ? labels(realBoxes()) : toast('Add some boxes first.');
    if (k === 'places') placesSheet();
  };
}

/* ---------- start ---------- */
async function init(){
  render();
  try {
    idb = await openDB();
    boxes = await dbAll();
    lastBackup = await metaGet('lastBackup') || null;
    household = await metaGet('household') || [];
    me = await metaGet('me') || '';
    voiceLang = await metaGet('voiceLang') || voiceLang;
    { const s = await metaGet('silenceMs'); if (typeof s === 'number') silenceMs = s; }
    notes = await noteAll();
    places = await metaGet('places') || [];
    if (!places.length){ places = [{id: newId(), name: (navigator.language || '').toLowerCase().startsWith('sv') ? 'Källaren' : 'Basement', createdAt: new Date().toISOString()}]; await metaPut('places', places); }
    for (const b of boxes) if (!b.placeId || !findPlace(b.placeId)){ b.placeId = places[0].id; await dbPut(clone(b)); }
    currentPlace = await metaGet('currentPlace') || 'all';
    if (currentPlace !== 'all' && !findPlace(currentPlace)) currentPlace = 'all';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch {
    app.innerHTML = '<p class="status">This browser won’t let Storrrage store data. Open it in Chrome, not in a private tab.</p>'; return;
  }
  ready = true; updateStatus(); render();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
init();
})();
</script>
